name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: pdo, pdo_mysql
        tools: composer:v2
    
    - name: Validate composer.json and composer.lock
      run: composer validate --strict
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction
    
    - name: Check PHP syntax
      run: |
        find . -type f -name "*.php" ! -path "./vendor/*" -exec php -l {} +
    
    - name: Run PHP Unit Tests (if PHPUnit is installed)
      run: |
        if [ -f vendor/bin/phpunit ]; then
          vendor/bin/phpunit
        else
          echo "PHPUnit not installed, skipping"
        fi
      continue-on-error: true
    
    - name: Check code style with PHP CodeSniffer (if installed)
      run: |
        if [ -f vendor/bin/phpcs ]; then
          vendor/bin/phpcs --standard=PSR12 app/ core/ public/
        else
          echo "PHP CodeSniffer not installed, installing..."
          composer require --dev squizlabs/php_codesniffer
          vendor/bin/phpcs --standard=PSR12 app/ core/ public/
        fi
      continue-on-error: true
    
    - name: Run PHPStan for static analysis (if installed)
      run: |
        if [ -f vendor/bin/phpstan ]; then
          vendor/bin/phpstan analyse
        else
          echo "PHPStan not installed, skipping"
        fi
      continue-on-error: true
